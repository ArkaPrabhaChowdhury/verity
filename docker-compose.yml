services:
  searxng:
    image: docker.io/searxng/searxng@sha256:252cfb5b348809167f5519970ca3457711e723afc76179a662b1c720cbbc1dd3
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-verity-local-only-change-me}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./search/searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      VERITY_SEARCH_PROVIDER: ${VERITY_SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL_DOCKER:-http://searxng:8080}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      VERITY_ADDR: :8080
      VERITY_DB_PATH: /app/data/verity.db
      VERITY_ALLOWED_ORIGINS: http://localhost:3000
      VERITY_CONCURRENCY: ${VERITY_CONCURRENCY:-1}
      VERITY_MAX_ACTIVE_RUNS: ${VERITY_MAX_ACTIVE_RUNS:-2}
      VERITY_API_TOKEN: ${VERITY_API_TOKEN:-}
      VERITY_SEARCH_COST_PER_QUERY: ${VERITY_SEARCH_COST_PER_QUERY:-}
    ports:
      - "8080:8080"
    volumes:
      - verity-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      searxng:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    environment:
      VERITY_API_URL: http://backend:8080
      VERITY_API_TOKEN: ${VERITY_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  verity-data:
  searxng-cache:
