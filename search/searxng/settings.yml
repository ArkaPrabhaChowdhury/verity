use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - bing
      - google

general:
  instance_name: Verity Search
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
